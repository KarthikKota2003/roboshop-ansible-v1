- name: Configuring shipping server
  hosts: shipping
  become: yes
  tasks:
  - name: Enabling maven
    command: dnf module enable maven:3.9 -y
  
  - name: Installing maven and java
    dnf:
      name:
      - maven
      - java-25-openjdk-devel
      state: present
  
  # There may be many subversion of java 25 already installed on target machine. We are taking the first sub-version and 
  # storing its original file path

  - name: Storing java 25 path
    shell: readlink -f $(ls /usr/lib/jvm/java-25-openjdk*/bin/java | head -1)
    register: java_path
  
  - name: Printing output
    debug:
      msg: "{{ java_path.stdout }}"
  
  - name: Setting java 25 as java version 
    command: alternatives --set java "{{ java_path.stdout }}"

  - name: Set JAVA_HOME variable
    copy:
      content: "export JAVA_HOME={{ java_path.stdout| dirname | dirname }}"
      dest: /etc/profile.d/java.sh
  
  - name: Setting JAVA_HOME in current shell
    shell: source /etc/profile.d/java.sh

  - name: Creating roboshop system user
    user:
      name: roboshop
      system: true
      create_home: false
      home: /app
      shell: /sbin/nologin
      state: present
  
  - name: Removing /app directory 
    file: 
      path: /app
      state: absent
  
  - name: Deleting .zip file
    file:
      path: /tmp/shipping.zip
      state: absent   
  
  - name: Creating /app directory
    file:
      path: /app
      state: directory
  
  - name: Downloading zip file
    get_url:
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/shipping-v4.zip
      dest: /tmp/shipping.zip
    
  - name: Unzipping shipping.zip 
    unarchive:
      src: /tmp/shipping.zip
      dest: /app
      remote_src: yes

  - name: Building the application
    command: mvn clean package
    args:
      chdir: /app


