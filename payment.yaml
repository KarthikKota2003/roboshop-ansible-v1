- name: Configuring Payment server
  hosts: payment
  become: yes
  tasks:
  - name: Installing python3.14
    dnf:
      name:
      - python3.14
      - python3.14-pip
      state: present
  
  - name: Creating system user for Payment module
    user:
      name: roboshop
      system: true
      create_home: false
      home: /app
      shell: /sbin/nologin
      state: present
  
  - name: Deleting previous app directory
    file:
      name: /app
      state: absent
  
  - name: Deleting previous .zip file
    file:
      name: /tmp/payment.zip
      state: absent
  
  - name: Creating app directory
    file:
      name: /app
      state: directory
  
  - name: Downloading .zip file
    get_url:
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/payment-v4.zip
      dest: /tmp/payment.zip
  
  - name: Unzipping .zip file into /app directory
    unarchive:
      src: /tmp/payment.zip
      dest: /app
      remote_src: yes
  
  