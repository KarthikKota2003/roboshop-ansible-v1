- name: Creating or Deleting EC2 instances
  hosts: local
  connection: local
  vars:
    instances: ['mongodb','redis','rabbitmq','mysql']
    action: create
    domain: kartheekops92.online
    ami_id: ami-0055977a6e828a4f4
  tasks:
  - name: Creating EC2 instances
    amazon.aws.ec2_instance:
      name: "roboshop-{{item}}"
      image_id: "{{ami_id}}"
      instance_type: t3.micro
      security_groups:
      - roboshop-common
      - "roboshop-{{item}}"
      region: us-east-1
    loop: "{{instances}}"
    when: action=="create"
    register: ec2_output

  - name: Creating R53 records for instances
    amazon.aws.route53:
      state: present
      zone: "{{domain}}"
      record: "{{item.item}}.{{domain}}"
      type: A
      ttl: 1
      value: "{{item.instances[0].private_ip_address}}"
      overwrite: true
    loop: "{{ec2_output.results}}"
    when: action=="create" 
  
  - name: Deleting R53 records for instances
    amazon.aws.route53:
      state: absent
      zone: "{{domain}}"
      record: "{{item}}.{{domain}}"
      ttl: 1
      type: A
    loop: "{{instances}}"
    when: action=="delete"
  
  # - name: Deleting EC2 instances
  #   amazon.aws.ec2_instance:
  #     state: absent
  #     instance_id: "{{item.instance_ids[0]}}"
  #   loop: "{{ec2_output.results}}"
  #   when: action=="delete"

  - name: Deleting EC2 instances
    amazon.aws.ec2_instance:
      state: absent
      name: "roboshop-{{item}}"
      region: us-east-1
      wait: false
    loop: "{{instances}}"
    when: action=="delete"
