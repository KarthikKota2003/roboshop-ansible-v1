- name: Creating or Deleting EC2 instances
  hosts: local
  connection: local
  vars:
    instances: ['mongodb','redis','rabbitmq','mysql']
    action: create
    domain: kartheekops92.online
    ami_id: ami-0055977a6e828a4f4
  tasks:
  - name: Creating instances
    amazon.aws.ec2_instance:
      name: "roboshop-{{item}}"
      image_id: "{{ami_id}}"
      instance_type: t3.micro
      security_groups:
      - roboshop-common
      - "roboshop-{{item}}"
      region: us-east-1
    loop: "{{instances}}"
    when: action=="create"
    register: ec2_output
  
  - name: Printing ec2 creation results
    debug:
      msg: "{{ec2_output}}"

  # - name: Creating DNS records for instances
