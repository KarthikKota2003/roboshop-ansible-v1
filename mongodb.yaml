- name: Configuring Mongodb instance
  hosts: mongodb
  become: yes
  tasks:
  - name: Copying mongo.repo file to roboshop-mongodb server
    copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo
  
  - name: Installing mongodb
    package:
      name: mongodb-org
      state: present
  
  - name: Starting mongodb service
    service:
      name: mongod
      state: started
      enabled: yes
    
  - name: Allow remote connections
    replace:
      path: /etc/mongod.conf
      regexp: 127.0.0.1
      replace: 0.0.0.0
  
  - name: Restarting mongod service
    service:
      name: mongod
      state: restarted
