- name: Configuring Mongodb instance
  hosts: mongodb
  become: yes
  tasks:
  - name: Copying mongo.repo file to roboshop-mongodb server
    copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo
  
  - name: Installing mongodb
    package:
      name: mongodb-org
      state: present
  
  - name: Starting mongodb service
    service:
      name: mongod
      state: started
      enabled: yes
